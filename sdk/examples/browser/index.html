<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GTO 솔버 SDK 예제</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --ink: #1d2433; --muted: #667085; --line: #e3e6eb; --accent: #2f6fde; --fold: #8a97b0; --call: #3fae7a; --raise: #f08c3a; --raise2: #e2573b; --allin: #9b1c2c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11151c; --card: #1a2029; --ink: #e8ecf2; --muted: #98a2b3; --line: #2a3240; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  label { color: var(--muted); font-size: 13px; }
  input, select, textarea, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  textarea { width: 100%; min-height: 54px; }
  button { cursor: pointer; background: var(--accent); color: #fff; border: none; padding: 7px 14px; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; max-width: 560px; }
  .cell { position: relative; aspect-ratio: 1; border-radius: 3px; overflow: hidden; background: var(--line); font-size: 11px; }
  .cell .bars { position: absolute; inset: 0; display: flex; }
  .cell span { position: absolute; left: 3px; top: 2px; font-weight: 600; color: #fff; text-shadow: 0 0 2px #000a; }
  .cell.dim { opacity: 0.25; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .act { display: flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .dot { width: 10px; height: 10px; border-radius: 2px; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; max-width: 420px; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width 0.2s; }
  .muted { color: var(--muted); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .two { grid-template-columns: 1fr; } }
  pre { white-space: pre-wrap; font-size: 12px; margin: 0; }
</style>
</head>
<body>
<main>
  <h1>GTO 솔버 SDK 예제</h1>
  <p class="sub">미리 푼 토너먼트 라이브러리 조회, 병렬 커스텀 솔브, 노드 잠금. 모든 계산은 이 브라우저 안에서 합니다.</p>

  <section>
    <h2>1. 프리플랍 라이브러리</h2>
    <div class="row">
      <label>포맷 <select id="pf-format"></select></label>
      <label>라인(액션 코드, 쉼표) <input id="pf-codes" size="34" placeholder="예: F,F,F,F,F,R2.2,F" /></label>
      <button id="pf-go">보기</button>
    </div>
    <div class="muted" id="pf-title"></div>
    <div class="acts" id="pf-acts"></div>
    <div class="grid" id="pf-grid"></div>
  </section>

  <section>
    <h2>2. 포스트플랍 라이브러리 (플랍 루트)</h2>
    <div class="row">
      <label>매치업 <select id="pl-match"></select></label>
      <label>플랍 <select id="pl-flop"></select></label>
      <button id="pl-go">보기</button>
    </div>
    <div class="muted" id="pl-title"></div>
    <div class="acts" id="pl-acts"></div>
  </section>

  <section>
    <h2>3. 커스텀 솔브 (병렬)</h2>
    <div class="row">
      <label>보드 <input id="cs-board" value="Kh7s2d9c" size="12" /></label>
      <label>팟 <input id="cs-pot" value="10" size="4" /></label>
      <label>스택 <input id="cs-stack" value="30" size="4" /></label>
      <label>프리셋 <select id="cs-preset"><option value="simple">단순</option><option value="standard" selected>표준</option><option value="complex">복합</option></select></label>
      <label>워커 <input id="cs-threads" type="number" min="1" max="16" size="3" /></label>
    </div>
    <div class="two">
      <label>OOP 레인지<textarea id="cs-oop">AA,KK,QQ,JJ,TT,99,77,22,AK,AQ,AJs,KQ,KJs,QJs,JTs,T9s,98s,87s,76s,65s,A5s,A4s</textarea></label>
      <label>IP 레인지<textarea id="cs-ip">AA,KK,QQ,JJ,TT,99,88,77,66,55,AK,AQ,AJ,ATs,A9s,A5s,KQ,KJ,KTs,QJ,QTs,JTs,T9s,98s,87s,76s</textarea></label>
    </div>
    <div class="row">
      <button id="cs-go">풀기</button>
      <button id="cs-lock" class="ghost" disabled>OOP 항상 체크로 잠그고 다시 풀기</button>
      <span class="muted" id="cs-status"></span>
    </div>
    <div class="bar"><div id="cs-bar"></div></div>
    <div class="acts" id="cs-acts"></div>
    <div class="grid" id="cs-grid"></div>
  </section>
  <pre class="muted" id="log"></pre>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
